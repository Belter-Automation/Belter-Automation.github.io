<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belter Automation LLC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100vw;
            min-height: 80vh;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }
        .logo-large {
            display: block;
            width: 100vw;
            max-width: 1200px;
            max-height: calc(100vh - 7rem);
            height: auto;
            margin: 0 auto 2rem auto;
            box-sizing: border-box;
        }
        .logo-small {
            display: none;
            width: 90vw;
            max-width: 500px;
            height: auto;
            margin: 0 auto 2rem auto;
        }
        .contact-link {
            font-size: 2.5rem;
            color: #222;
            margin-top: 2rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-decoration: none;
            transition: color 0.2s;
            word-break: break-word;
            z-index: 2;
        }
        .contact-link:hover {
            color: #0078d4;
        }
        @media (max-width: 900px) {
            .logo-large {
                display: none !important;
            }
            .logo-small {
                display: block !important;
            }
            .container {
                min-height: 70vh;
            }
            .contact-link {
                font-size: 2rem;
            }
        }
        @media (max-width: 600px) {
            .container {
                min-height: 60vh;
            }
            .contact-link {
                font-size: 1.2rem;
            }
            .logo-small {
                max-width: 95vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Belter large.png" alt="Belter Large" class="logo-large">
        <img src="Belter logo.png" alt="Belter Logo" class="logo-small">
        <a href="mailto:steve@belterautomation.com" class="contact-link">Contact Us</a>
    </div>
</body>
</html>
