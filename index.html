<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belter Automation LLC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100vw;
            min-height: 80vh;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }
        .logo-large {
            display: block;
            width: 100vw;
            max-width: 1200px;
            max-height: calc(100vh - 7rem);
            height: auto;
            margin: 0 auto 2rem auto;
            box-sizing: border-box;
        }
        .logo-small {
            display: none;
            width: 90vw;
            max-width: 500px;
            height: auto;
            margin: 0 auto 2rem auto;
        }
        .contact-link {
            font-size: 2.5rem;
            color: #222;
            margin-top: 2rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-decoration: none;
            transition: color 0.2s;
            word-break: break-word;
            z-index: 2;
        }
        .contact-link:hover {
            color: #0078d4;
        }
        @media (max-width: 900px) {
            .logo-large {
                display: none !important;
            }
            .logo-small {
                display: block !important;
            }
            .container {
                min-height: 70vh;
            }
            .contact-link {
                font-size: 2rem;
            }
        }
        @media (max-width: 600px) {
            .container {
                min-height: 60vh;
            }
            .contact-link {
                font-size: 1.2rem;
            }
            .logo-small {
                max-width: 95vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Belter large.png" alt="Belter Large" class="logo-large">
        <img src="Belter logo.png" alt="Belter Logo" class="logo-small">
        <a href="mailto:steve@belterautomation.com" class="contact-link">Contact Us</a>
    </div>
    <script>
    function scaleLogo() {
        const logoLarge = document.querySelector('.logo-large');
        const contactLink = document.querySelector('.contact-link');
        if (!logoLarge || !contactLink) return;

        // Only run on desktop (large logo visible)
        if (window.innerWidth <= 900) {
            logoLarge.style.maxHeight = '';
            logoLarge.style.width = '';
            logoLarge.style.height = '';
            return;
        }

        // Get the natural aspect ratio of the image
        let naturalWidth = logoLarge.naturalWidth;
        let naturalHeight = logoLarge.naturalHeight;
        if (!naturalWidth || !naturalHeight) {
            // If not loaded yet, wait for image to load
            logoLarge.onload = scaleLogo;
            return;
        }
        const aspectRatio = naturalWidth / naturalHeight;

        // Get viewport height and Contact Us position
        const contactRect = contactLink.getBoundingClientRect();
        const availableHeight = contactRect.top - 48; // 48px for margin
        const availableWidth = window.innerWidth;

        // Use 90% of available space, but not less than 300px and not more than 900px
        const maxHeight = Math.max(300, Math.min(availableHeight * 0.9, 900));
        const maxWidth = Math.max(300, Math.min(availableWidth * 0.95, 1200));

        // Calculate the largest size that fits both constraints and preserves aspect ratio
        let finalWidth = maxWidth;
        let finalHeight = finalWidth / aspectRatio;
        if (finalHeight > maxHeight) {
            finalHeight = maxHeight;
            finalWidth = finalHeight * aspectRatio;
        }

        logoLarge.style.width = finalWidth + 'px';
        logoLarge.style.height = finalHeight + 'px';
        logoLarge.style.maxWidth = finalWidth + 'px';
        logoLarge.style.maxHeight = finalHeight + 'px';
    }

    window.addEventListener('resize', scaleLogo);
    window.addEventListener('DOMContentLoaded', scaleLogo);
    </script>
    </div>
</body>
</html>
