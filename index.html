<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belter Automation LLC</title>
    <style>
                /* Browser-specific rules */
                /* iOS Safari */
                @supports (-webkit-touch-callout: none) {
                    .container {
                        padding-bottom: env(safe-area-inset-bottom, 0px);
                    }
                }
                /* Chrome (Webkit) */
                @media screen and (-webkit-min-device-pixel-ratio:0) {
                    .logo-large, .logo-small {
                        image-rendering: -webkit-optimize-contrast;
                    }
                }
                /* Firefox */
                @-moz-document url-prefix() {
                    .logo-large, .logo-small {
                        image-rendering: crisp-edges;
                    }
                }
                /* Edge (Chromium) */
                @media all and (-ms-high-contrast: none), (-ms-high-contrast: active) {
                    .logo-large, .logo-small {
                        image-rendering: auto;
                    }
                }
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            box-sizing: border-box;
            text-align: center;
            position: relative;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .logo-large {
            display: block;
            max-width: 90vw;
            max-height: 60vh;
            width: auto;
            height: auto;
            margin: 0 auto 2rem auto;
            box-sizing: border-box;
            object-fit: contain;
        }
        .logo-small {
            display: none;
            width: auto;
            height: auto;
            margin: 0 auto 2rem auto;
            object-fit: contain;
        }
        .contact-link {
            font-size: 2.5rem;
            color: #222;
            margin-top: 2rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-decoration: none;
            transition: color 0.2s;
            word-break: break-word;
            z-index: 2;
        }
        .contact-link:hover {
            color: #0078d4;
        }
        @media (max-width: 900px), (pointer: coarse) {
            .logo-large {
                display: none !important;
            }
            .logo-small {
                display: block !important;
                width: auto !important;
                height: auto !important;
                object-fit: contain !important;
            }
            .container {
                min-height: 70vh;
            }
            .contact-link {
                font-size: 2rem;
            }
            .desktop-link {
                display: block !important;
                font-size: 1.2rem;
                margin-bottom: 2rem;
                color: #0078d4;
                text-decoration: underline;
                cursor: pointer;
            }
        }
        @media (max-width: 600px) {
            .container {
                min-height: 60vh;
            }
            .contact-link {
                font-size: 1.2rem;
            }
            .logo-small {
                width: auto !important;
                height: auto !important;
                object-fit: contain !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Belter large.png" alt="Belter Large" class="logo-large">
        <img src="Belter logo.png" alt="Belter Logo" class="logo-small">
        <a href="mailto:steve@belterautomation.com" class="contact-link">Contact Us</a>
    </div>
    </script>
    </div>
</body>
</html>
